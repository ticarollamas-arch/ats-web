# Snippet para colocar DENTRO do server { } do seu domínio.
# Ex.: salve em /etc/nginx/snippets/ats.conf e adicione "include snippets/ats.conf;" no server.

# /ats  ->  /ats/   (o frontend usa caminhos relativos e precisa da barra final)
location = /ats { return 301 /ats/; }

location /ats/ {
    proxy_pass         http://127.0.0.1:8095/;     # a barra final remove o prefixo /ats
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
    client_max_body_size 8m;                         # upload de PDF/DOCX para auditoria
}
