# Use SOMENTE se o domínio ainda não tem server block no nginx.
# Se já existe site em osachadinhosdashopee.com.br, use ats-location.conf dentro dele.
server {
    listen 80;
    server_name osachadinhosdashopee.com.br www.osachadinhosdashopee.com.br;

    include /etc/nginx/snippets/ats.conf;

    location / { return 404; }   # troque pelo seu site principal, se houver
}
